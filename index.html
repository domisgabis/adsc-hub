<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADSC Głosowanie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a1f;--panel:#16143a;--panel2:#1f1c4d;--line:#34306b;--tx:#f2f0ff;--mut:#9b97c9;--pink:#ff3d9a;--gold:#ffc83d;--ok:#3ddc97;
--f1:'Unbounded',system-ui,sans-serif;--f2:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#4b1d8f55,transparent),radial-gradient(700px 400px at -10% 10%,#ff3d9a33,transparent),var(--bg);
color:var(--tx);font:16px/1.5 var(--f2);min-height:100vh}
#app{max-width:1000px;margin:0 auto;padding:24px 16px 80px}
h1,h2,h3{font-family:var(--f1);margin:0 0 8px;font-weight:700;letter-spacing:-.02em}
h1{font-size:clamp(26px,6vw,40px)} h2{font-size:22px} h3{font-size:17px}
.sub,.mut{color:var(--mut)}
button{font:inherit;font-weight:700;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--pink)} button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pri{background:linear-gradient(90deg,var(--pink),#9b4dff);border:0}
input,select{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.c{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left}
.c span{font-size:32px;line-height:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:2px 10px;background:var(--panel2);color:var(--mut);margin-right:6px}
.tag.jury{background:var(--gold);color:#241a00}
.me{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.me .f{font-size:30px}
.rk{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.pt{min-width:46px;text-align:center;font-family:var(--f1);font-weight:700;border-radius:10px;padding:6px 0;background:var(--panel2);color:var(--mut)}
.pt.p12{background:var(--gold);color:#241a00}.pt.p10{background:#ff3d9a;color:#fff}
.rk .t{flex:1;min-width:0}.rk .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar button{padding:4px 10px}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button.on{background:var(--pink);border-color:var(--pink)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:first-child td{font-weight:800}.big{font-family:var(--f1)}
.x{padding:2px 9px;color:#ff7a9a}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#06241a;font-weight:800;padding:10px 18px;border-radius:99px;z-index:50}
.toast.err{background:#ff5a7a;color:#fff}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;padding:20px;overflow:auto;display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;max-width:1100px;margin:0 auto;width:100%}
@media(max-width:760px){.stage{grid-template-columns:1fr}}
.who{font-family:var(--f1);font-size:clamp(22px,4vw,34px)}
.giant{font-family:var(--f1);font-size:clamp(70px,16vw,150px);color:var(--gold);line-height:1;margin:10px 0}
.sb .rk{transition:transform .5s,background .3s}.sb .rk.hit{border-color:var(--gold);background:#3a2f0b}
.sb .tot{font-family:var(--f1);min-width:48px;text-align:right}.add{color:var(--gold);font-family:var(--f1);font-size:13px;min-width:34px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.sg{display:block;color:var(--mut);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg i{opacity:.6}
.pe{display:grid;grid-template-columns:140px 1fr 1fr auto auto;gap:8px;align-items:center;margin:8px 0}
@media(max-width:760px){.pe{grid-template-columns:1fr 1fr}.pe b{grid-column:1/-1}}
.gw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.g{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:14px}
.g th,.g td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.g thead th{background:var(--panel2);color:var(--mut);font-weight:700;border-bottom:1px solid var(--line)}
.g th.v{height:130px;vertical-align:bottom;padding:8px 3px;min-width:34px}
.g th.v span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;color:var(--tx)}
.g th.nv span{opacity:.4}
.g .l{position:sticky;left:0;z-index:2;text-align:left;min-width:210px;max-width:260px;background:var(--panel);box-shadow:1px 0 0 var(--line)}
.g thead .l{background:var(--panel2)}
.g .l .sg{max-width:230px}
.g .l .rn{display:inline-block;min-width:22px;color:var(--mut);font-family:var(--f1);font-size:12px}
.g .sep{border-left:2px solid var(--pink)}
.g .tt{font-family:var(--f1);font-size:15px;color:var(--gold)}
.cell{display:inline-block;min-width:26px;padding:2px 0;border-radius:8px;font-family:var(--f1);font-size:12px;background:var(--panel2);line-height:1.5}
.cell.p12{background:var(--gold);color:#241a00}.cell.p10{background:var(--pink);color:#fff}
.cell.z{background:none;color:#4a4690}
.cell small{display:block;font:600 10px var(--f2);color:var(--mut);line-height:1.1;padding-bottom:1px}
.cell.p12 small,.cell.p10 small{color:inherit;opacity:.75}
</style>
</head>
<body>
<div id="app"><p class="mut">Ładowanie…</p></div>
<script>
// ====== KONFIGURACJA — uzupełnij danymi ze Supabase (Project Settings → API) ======
const SUPABASE_URL = 'https://phimmupuvxtjoswmzxao.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wU-9nv4sTGtThO6fdgLd2Q_VtMyr0GD';
// ==================================================================================
const SC = [12,10,8,6,5,4,3,2,1,0];
const H = {apikey:SUPABASE_KEY,'Content-Type':'application/json'};
if (SUPABASE_KEY.startsWith('eyJ')) H.Authorization = 'Bearer ' + SUPABASE_KEY;
const api = (p,o={}) => fetch(SUPABASE_URL+'/rest/v1/'+p,{headers:H,...o}).then(async r=>{
  const t = await r.text(); let j = null; try{j = t ? JSON.parse(t) : null}catch(e){}
  if(!r.ok) throw new Error((j && j.message) || t || r.status); return j});
const rpc = (n,b) => api('rpc/'+n,{method:'POST',body:JSON.stringify(b)});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const ls = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const am = location.hash.match(/admin=([^&]+)/);
const S = {countries:[],heats:[],parts:[],me:+ls.get('me')||null,view:'home',heat:null,order:[],voted:[],secret:am?decodeURIComponent(am[1]):null,votes:[],tab:null,pres:null};

const cn = id => (S.countries.find(c=>c.id===id)||{name:'?'}).name;
const hn = h => h.name || 'Heat '+h.id;
const host = () => (S.countries.find(c=>c.is_host)||{}).id;
const parts = h => S.parts.filter(p=>p.heat_id===h).sort((a,b)=>(a.running_order||0)-(b.running_order||0)||a.id-b.id);
const myHeats = () => S.parts.filter(p=>p.country_id===S.me).map(p=>p.heat_id);
const isJury = h => myHeats().includes(h) || S.me===host();
const part = id => S.parts.find(p=>p.id===id);
// Wykonawca i tytuł: „Wykonawca — „Tytuł””; pusty tekst, gdy brak danych
const info = p => [p.artist&&esc(p.artist), p.song&&'„'+esc(p.song)+'”'].filter(Boolean).join(' — ');
const who = p => `<div class="t"><b>${esc(cn(p.country_id))}</b><span class="sg">${info(p)||'<i>brak danych o piosence</i>'}</span></div>`;
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}

async function load(){
  [S.countries,S.heats,S.parts] = await Promise.all([api('countries?select=*&order=name'),api('heats?select=*&order=id'),api('heat_participants?select=*&order=running_order,id')]);
  if(S.me && !S.countries.some(c=>c.id===S.me)) S.me=null;
  if(S.tab===null && S.heats.length) S.tab=S.heats[0].id;
  if(S.secret) S.votes = await rpc('admin_results',{p_secret:S.secret});
  else if(S.me) S.voted = await rpc('my_votes',{p_voter:S.me});
}
async function refresh(){try{await load();render()}catch(e){toast(e.message,1)}}

// ====== Wybór kraju ======
function vPick(){return `<h1>Eurovision Vote</h1><p class="sub">Wybierz kraj, który reprezentujesz.</p>
<input id="q" placeholder="Szukaj kraju" oninput="filt(this.value)">
<div class="grid">${S.countries.map(c=>`<button class="c" data-n="${esc(c.name.toLowerCase())}" onclick="pick(${c.id})">${esc(c.name)}</button>`).join('')}</div>`}
function filt(v){v=v.toLowerCase();document.querySelectorAll('.grid .c').forEach(b=>b.style.display=b.dataset.n.includes(v)?'':'none')}
function pick(id){S.me=id;ls.set('me',id);refresh()}
function logout(){S.me=null;ls.set('me','');render()}

// ====== Lista heatów ======
function vHeats(){
  const mine = myHeats();
  return `<div class="me row sp"><div><h2>${esc(cn(S.me))}</h2><span class="mut">${S.me===host()?'Gospodarz: jurorujesz w każdym heacie':mine.length?'Występujesz w: '+mine.map(id=>esc(hn(S.heats.find(h=>h.id===id)))).join(', '):'Twój kraj nie występuje w żadnym heacie'}</span></div><button onclick="logout()">Zmień kraj</button></div>
  ${S.heats.map(h=>{const ps=parts(h.id),own=isJury(h.id),n=ps.filter(p=>p.country_id!==S.me).length;
  return `<div class="card row sp wrap"><div><h3>${esc(hn(h))}</h3>
  <span class="tag ${own?'jury':''}">${own?'Głosujesz jako jury':'Rest of the World'}</span>${h.open?'':'<span class="tag">zamknięty</span>'}${S.voted.includes(h.id)?'<span class="tag" style="color:var(--ok)">zagłosowano</span>':''}
  <p class="mut" style="margin:6px 0 0">${ps.length} krajów</p></div>
  <button class="pri" ${n<1||!h.open||S.voted.includes(h.id)?'disabled':''} onclick="openVote(${h.id})">${S.voted.includes(h.id)?'Zagłosowano':'Głosuj'}</button></div>`}).join('')}`}

// ====== Głosowanie ======
function openVote(h){S.heat=h;S.order=parts(h).filter(p=>p.country_id!==S.me).map(p=>p.id);S.view='vote';render()}
function mv(i,d){const o=S.order,j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];render()}
function vVote(){
  const h=S.heats.find(x=>x.id===S.heat),own=isJury(S.heat);
  return `<button onclick="S.view='home';render()">Wróć</button>
  <h1 style="margin-top:16px">${esc(hn(h))}</h1>
  <p class="sub">${own?'Głosujesz jako jury kraju '+esc(cn(S.me))+'.':'Twój głos trafi do puli Rest of the World.'} Ustaw kraje od najlepszego do najsłabszego strzałkami.</p>
  ${S.order.map((id,i)=>{const p=SC[i]||0;
  return `<div class="rk"><div class="pt ${p==12?'p12':p==10?'p10':''}">${p||'–'}</div>${who(part(id))}
  <div class="ar row"><button aria-label="W górę" onclick="mv(${i},-1)">▲</button><button aria-label="W dół" onclick="mv(${i},1)">▼</button></div></div>`}).join('')}
  <button class="pri" style="width:100%;margin-top:14px" onclick="sendVote()">Zapisz głos</button>`}
async function sendVote(){
  try{await rpc('submit_vote',{p_voter:S.me,p_heat:S.heat,p_ranking:S.order});toast('Głos zapisany');S.view='home';await refresh()}
  catch(e){toast(e.message,1)}}

// ====== Liczenie wyników ======
// votes = (kraj głosujący, uczestnik heatu, punkty). Jury = kraje z heatu + gospodarz; reszta głosujących = Rest of the World.
function calc(hid){
  const ps=parts(hid),cids=ps.map(p=>p.country_id),pid=new Set(ps.map(p=>p.id)),by={},ho=host();
  S.votes.filter(v=>pid.has(v.participant)).forEach(v=>{(by[v.voter]=by[v.voter]||{})[v.participant]=v.points});
  const jc=[...cids];if(ho&&!jc.includes(ho))jc.push(ho);
  const juries=jc.map(c=>({name:cn(c),cid:c,host:c===ho,pts:by[c]||null}));
  const rest=Object.entries(by).filter(([v])=>!jc.includes(+v)).map(x=>x[1]);
  const raw=Object.fromEntries(ps.map(p=>[p.id,0]));
  rest.forEach(pts=>{for(const id in pts)raw[id]+=pts[id]});
  const rk=ps.map(p=>p.id).sort((a,b)=>raw[b]-raw[a]||a-b);
  const rotw={name:'Rest of the World',cid:null,row:true,n:rest.length,raw,pts:rest.length?Object.fromEntries(rk.slice(0,10).map((id,i)=>[id,SC[i]])):null};
  const cols=[...juries,rotw],jurors=cols.filter(j=>j.pts);
  const rows=ps.map(p=>{let jury=0,row=0;jurors.forEach(j=>{const x=j.pts[p.id]||0;j.row?row+=x:jury+=x});return{p,jury,row,total:jury+row}});
  rows.sort((a,b)=>b.total-a.total||b.jury-a.jury);
  return{ps,cols,jurors,rows,nJury:juries.filter(j=>j.pts).length,nExp:juries.length,nRow:rest.length}}

// ====== Panel admina ======
function cell(j,p){
  if(j.cid===p.country_id)return '<span class="cell z" title="własny kraj">×</span>';
  if(!j.pts)return '<span class="cell z" title="brak głosu">–</span>';
  const x=j.pts[p.id]||0;
  if(!x)return '<span class="cell z">·</span>';
  return `<span class="cell ${x==12?'p12':x==10?'p10':''}">${x}${j.row?`<small>${j.raw[p.id]}</small>`:''}</span>`}
function vAdmin(){
  const h=S.heats.find(x=>x.id===S.tab);if(!h)return '<p class="mut">Brak heatów w bazie.</p>';
  const r=calc(h.id),used=new Set(S.parts.filter(p=>p.heat_id===h.id).map(p=>p.country_id)),nj=r.cols.length-1;
  return `<h1>Panel admina</h1>
  <div class="tabs">${S.heats.map(x=>`<button class="${x.id===S.tab?'on':''}" onclick="S.tab=${x.id};render()">${esc(hn(x))}</button>`).join('')}</div>
  <div class="card"><div class="row sp wrap"><h2>Wyniki: ${esc(hn(h))}</h2>
  <div class="row"><button onclick="toggleOpen()">${h.open?'Zamknij głosowanie':'Otwórz głosowanie'}</button><button class="pri" ${r.jurors.length?'':'disabled'} onclick="startPres(${h.id})">Prezentacja</button></div></div>
  <p class="mut">Jurorzy, którzy zagłosowali: ${r.nJury} z ${r.nExp}. Głosujących w Rest of the World: ${r.nRow}.</p>
  ${r.rows.length?`<div class="gw"><table class="g"><thead>
  <tr><th class="l" rowspan="2">Kraj</th><th colspan="${nj}">Jurorzy przyznają punkty</th><th class="sep" rowspan="2">Rest of<br>the World</th><th class="sep" colspan="3">Podsumowanie</th></tr>
  <tr>${r.cols.slice(0,nj).map(j=>`<th class="v ${j.pts?'':'nv'}"><span>${esc(j.name)}${j.host?' (gospodarz)':''}</span></th>`).join('')}<th class="sep">Jury</th><th>ROTW</th><th>Razem</th></tr></thead><tbody>
  ${r.rows.map((x,i)=>`<tr><td class="l"><span class="rn">${i+1}</span><b>${esc(cn(x.p.country_id))}</b><span class="sg" style="margin-left:22px">${info(x.p)||'<i>brak danych o piosence</i>'}</span></td>
  ${r.cols.map((j,k)=>`<td class="${j.row?'sep':''}">${cell(j,x.p)}</td>`).join('')}
  <td class="sep">${x.jury}</td><td>${x.row}</td><td class="tt">${x.total}</td></tr>`).join('')}</tbody></table></div>
  <p class="mut" style="font-size:13px;margin-bottom:0">Wiersze są ułożone wg wyniku. × = własny kraj, – = juror jeszcze nie zagłosował. W kolumnie Rest of the World duża liczba to przyznane punkty, a mała pod spodem to suma punktów od wszystkich głosujących, z której powstał ranking.</p>`:'<p class="mut">Ten heat nie ma jeszcze krajów. Dodaj pierwszy poniżej.</p>'}</div>
  <div class="card"><h3>Kraje w heacie (${r.ps.length})</h3>
  ${r.ps.map(p=>`<div class="pe"><b>${esc(cn(p.country_id))}</b><input id="ar${p.id}" placeholder="Wykonawca" value="${esc(p.artist||'')}"><input id="as${p.id}" placeholder="Tytuł piosenki" value="${esc(p.song||'')}"><button onclick="savePart(${p.id})">Zapisz</button><button class="x" onclick="delPart(${p.id})">Usuń</button></div>`).join('')}
  <div class="row wrap" style="margin-top:16px"><select id="ac" style="flex:1 1 160px">${S.countries.filter(c=>!used.has(c.id)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
  <input id="na" placeholder="Wykonawca" style="flex:1 1 160px"><input id="ns" placeholder="Tytuł piosenki" style="flex:1 1 160px"><button class="pri" onclick="addPart()">Dodaj kraj</button></div>
  <p class="mut" style="font-size:13px">Dodanie lub usunięcie kraju kasuje oddane głosy w tym heacie, bo stare rankingi przestają pasować. Edycja wykonawcy i tytułu głosów nie kasuje.</p></div>
  <div class="card"><h3>Gospodarz (jury w każdym heacie)</h3><p class="mut">Obecnie: ${host()?esc(cn(host())):'brak'}</p>
  <div class="row wrap"><select id="ah" style="flex:1 1 200px"><option value="0">Brak gospodarza</option>${S.countries.map(c=>`<option value="${c.id}" ${c.is_host?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="pri" onclick="setHost()">Zapisz gospodarza</button></div></div>`}
async function admin(fn,b,msg){try{await rpc(fn,{p_secret:S.secret,...b});if(msg)toast(msg);await refresh()}catch(e){toast(e.message,1)}}
function addPart(){const c=$('#ac').value;if(!c)return toast('Wszystkie kraje są już w tym heacie',1);
  admin('admin_add_participant',{p_country:+c,p_heat:S.tab,p_artist:$('#na').value,p_song:$('#ns').value},'Dodano')}
function savePart(id){admin('admin_update_participant',{p_id:id,p_artist:$('#ar'+id).value,p_song:$('#as'+id).value},'Zapisano')}
function delPart(id){if(confirm('Usunąć ten kraj z heatu? Głosy w heacie zostaną skasowane.'))admin('admin_remove_participant',{p_id:id},'Usunięto')}
function setHost(){admin('admin_set_host',{p_country:+$('#ah').value||null},'Zapisano gospodarza')}
function toggleOpen(){const h=S.heats.find(x=>x.id===S.tab);admin('admin_set_open',{p_heat:h.id,p_open:!h.open})}

// ====== Prezentacja ======
function startPres(h){const r=calc(h),steps=[];
  r.jurors.forEach(j=>steps.push({j,p:1},{j,p:2}));
  S.pres={h,r,steps,i:-1,sc:Object.fromEntries(r.ps.map(p=>[p.id,0])),last:{}};drawPres()}
function nextPres(){const P=S.pres;if(!P||P.i>=P.steps.length-1)return;
  P.i++;const{j,p}=P.steps[P.i];P.last={};
  for(const id in j.pts){const pt=j.pts[id];if((p===2)===(pt===12)){P.sc[id]+=pt;P.last[id]=pt}}
  drawPres()}
function drawPres(){
  const P=S.pres,st=P.steps[P.i],done=P.i===P.steps.length-1;
  let ov=$('#ov');if(!ov){ov=document.createElement('div');ov.id='ov';ov.className='ov';document.body.appendChild(ov)}
  const sorted=[...P.r.ps].sort((a,b)=>P.sc[b.id]-P.sc[a.id]||a.id-b.id),h=S.heats.find(x=>x.id===P.h);
  let left;
  if(!st)left=`<div><p class="mut">${esc(hn(h))}</p><div class="who">Czas na głosy jury</div><p class="mut">Kliknij „Dalej” lub naciśnij spację.</p></div>`;
  else{const top=P.r.ps.find(p=>st.j.pts[p.id]===12);
    left=`<div><div class="who">${esc(st.j.name)}</div>
    ${st.p===1?`<p class="mut" style="font-size:18px">przyznaje punkty od 1 do 10…</p>`:`<p class="mut" style="font-size:18px">i 12 punktów dla…</p><div class="giant">12</div><div class="who">${esc(cn(top.country_id))}</div><p class="mut" style="font-size:18px">${info(top)}</p>`}
    ${done?`<p class="who" style="color:var(--gold);margin-top:30px">Zwycięzca: ${esc(cn(sorted[0].country_id))}</p><p class="mut">${info(sorted[0])}</p>`:''}</div>`}
  ov.innerHTML=`<div class="row sp"><span class="mut">${P.i+1} / ${P.steps.length}</span><button onclick="closePres()">Zamknij</button></div>
  <div class="stage"><div style="display:flex;align-items:center">${left}</div>
  <div class="sb">${sorted.map(p=>`<div class="rk ${P.last[p.id]?'hit':''}">${who(p)}<span class="add">${P.last[p.id]?'+'+P.last[p.id]:''}</span><span class="tot">${P.sc[p.id]}</span></div>`).join('')}</div></div>
  <div style="text-align:center;margin-top:12px">${done?'':'<button class="pri" onclick="nextPres()">Dalej</button>'}</div>`}
function closePres(){S.pres=null;const o=$('#ov');if(o)o.remove()}
document.addEventListener('keydown',e=>{if(!S.pres)return;
  if([' ','Enter','ArrowRight'].includes(e.key)){e.preventDefault();nextPres()}if(e.key==='Escape')closePres()});

// ====== Start ======
function render(){
  $('#app').innerHTML = S.secret ? vAdmin() : !S.me ? vPick() : S.view==='vote' ? vVote() : vHeats()}
load().then(render).catch(e=>{$('#app').innerHTML=`<div class="card"><h3>Nie udało się połączyć z bazą</h3><p class="mut">${esc(e.message)}. Sprawdź SUPABASE_URL i SUPABASE_KEY na górze skryptu oraz czy uruchomiono supabase.sql.</p></div>`});
</script>
</body>
</html>
